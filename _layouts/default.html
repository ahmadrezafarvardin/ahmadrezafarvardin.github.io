<!doctype html>
<html lang="{{ site.lang }}">
<head>
{% include head.html %}
</head>
<body class="{{ page.body_class }}">
<a class="skip" href="#main">Skip to content</a>
<header class="site-head wrap">
  <a class="wordmark" href="{{ '/' | relative_url }}">Ahmadreza Farvardin</a>
  <nav aria-label="Main">
    {% assign here = page.url %}
    <a href="{{ '/projects/' | relative_url }}" {% if here contains '/projects/' %}aria-current="page"{% endif %}>Projects</a>
    <a href="{{ '/cv/' | relative_url }}" {% if here == '/cv/' %}aria-current="page"{% endif %}>CV</a>
    <a href="mailto:{{ site.author.email }}">Email</a>
    <button class="theme-toggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg viewBox="0 0 24 24" width="17" height="17" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18V3z" fill="currentColor"/><circle cx="12" cy="12" r="8.25" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
    </button>
  </nav>
</header>

<main id="main">
{{ content }}
</main>

<footer class="site-foot wrap">
  {% include social.html class="foot-social" full=true %}
  <p class="foot-meta">Tehran · updated {{ site.time | date: "%B %Y" }}</p>
</footer>

<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
